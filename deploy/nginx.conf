# Nginx delante de Gunicorn (EC2). Con ALB + ACM, el TLS termina en el ALB y este
# bloque escucha en 80 solo desde el Security Group del ALB.
server_tokens off;

limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name marketplace.ejemplo.mx;

    ssl_certificate     /etc/ssl/marketplace/fullchain.pem;
    ssl_certificate_key /etc/ssl/marketplace/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location / {
        limit_req zone=perip burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # sobrescribe, no concatena
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
    }
}

server {
    listen 80;
    server_name marketplace.ejemplo.mx;
    return 301 https://$host$request_uri;
}
