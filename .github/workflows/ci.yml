name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sin secretos y con el permiso minimo: el flujo solo necesita leer el codigo.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas automáticas
        run: pytest
      - name: Análisis estático de seguridad (bandit)
        run: bandit -r .
      - name: Dependencias con vulnerabilidades conocidas (pip-audit)
        run: pip-audit -r requirements.txt
        # Hoy reporta hallazgos pendientes; se quita cuando se actualicen las librerias.
        continue-on-error: true
      - name: Estilo del código (ruff)
        run: |
          pip install ruff==0.17.6
          ruff check .
        # Se hace obligatorio al terminar la limpieza de estilo.
        continue-on-error: true
